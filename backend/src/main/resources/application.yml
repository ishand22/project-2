server:
  port: 8080
spring:
  application.name: entitleflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/entitleflow}
    username: ${SPRING_DATASOURCE_USERNAME:entitleflow}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  data.mongodb.uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/entitleflow}
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
app:
  username: ${APP_USERNAME:admin}
  password: ${APP_PASSWORD:change-me-local}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
