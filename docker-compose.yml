services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entitleflow}
      POSTGRES_USER: ${POSTGRES_USER:-entitleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entitleflow} -d ${POSTGRES_DB:-entitleflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-entitleflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-entitleflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:-entitleflow}
      APP_USERNAME: ${ADMIN_USERNAME:-admin}
      APP_PASSWORD: ${ADMIN_PASSWORD:-change-me-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_started}
  ai-service:
    build: ./ai-service
    environment:
      APP_API_URL: http://backend:8080
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-me-local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports: ["8000:8000"]
    depends_on: [backend]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend, ai-service]
volumes:
  postgres-data:
  mongo-data:
