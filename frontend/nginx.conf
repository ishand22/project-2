server {
  listen 80;
  location /api/ { proxy_pass http://backend:8080/api/; }
  location /diagnostics/ { proxy_pass http://ai-service:8000/diagnostics/; }
  location /health { proxy_pass http://ai-service:8000/health; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
